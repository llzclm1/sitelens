name: Site QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Set up Python browser runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install -r qa/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start local app server
        run: SITELENS_QA=1 npm run start -- -p 3000 > /tmp/sitelens-next.log 2>&1 &

      - name: Run browser QA
        run: npm run qa:smoke

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitelens-playwright
          path: |
            output/playwright/
            /tmp/sitelens-next.log
          if-no-files-found: warn
